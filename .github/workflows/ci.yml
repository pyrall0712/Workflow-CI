name: Machine Learning CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  ml_ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow pandas scikit-learn dagshub

    - name: Run MLflow Project (Re-training)
      run: |
        python -m mlflow run . --no-conda

    - name: Build Docker Image from MLflow Model
      run: |
        python -m mlflow models build-docker -m "runs:/CI_Automated_Run/model" -n "pyrall0712/iris-model-api:latest" --enable-mlserver