name: Machine Learning CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  ml_ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow pandas scikit-learn dagshub
        
    - name: Run MLflow Project (Re-training)
      run: |
        python -m mlflow run . --env-manager local
    
    - name: Run MLflow Project (Re-training)
      env:
        DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        python -m mlflow run . --env-manager local

    # MENGGUNAKAN DOCKER BUILD BUATAN GITHUB ACTIONS (ANTI-ERROR)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false # Set true jika nanti Anda ingin push ke Docker Hub
        tags: pyrall0712/iris-model-api:latest